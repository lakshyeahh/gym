<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A45CFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Buddy">
<title>My Gym Buddy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<div id="app">
  <section class="screen active" id="home"><div class="scroll" id="home-scroll"></div></section>
  <section class="screen" id="list"><div class="scroll" id="list-scroll"></div><footer class="dock" id="list-dock"></footer></section>
  <section class="screen" id="player">
    <header class="p-top" id="p-top"></header>
    <div class="p-viewport" id="p-viewport"></div>
    <footer class="dock p-dock" id="p-dock"></footer>
  </section>
  <section class="screen" id="done"><div class="confetti" id="confetti" aria-hidden="true"></div><div class="scroll" id="done-scroll"></div></section>
  <section class="screen" id="library"><div class="scroll" id="library-scroll"></div></section>
</div>
<script src="plan.js?v=5"></script>
<script src="figures.js?v=5"></script>
<script src="app.js?v=5"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
